<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordena cronològicament · Escoles FRETA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pine-dark: #12342a;
    --pine: #1d4d3c;
    --moss: #4a7a63;
    --lichen: #8fb29f;
    --ice: #cfe1e4;
    --frost: #e8f1f2;
    --snow: #f7faf9;
    --ink: #22373a;
    --orange: #fe6600;
    --ok: #2b7a4b;
    --ok-bg: #e0f1e5;
    --ko: #b3322b;
    --ko-bg: #fbe5e2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 18px 14px 28px;
    font-family: 'Public Sans', Arial, Helvetica, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--frost) 0%, #dbe9e9 100%);
  }
  .fitxa {
    max-width: 780px; margin: 0 auto; background: #fff;
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 6px 24px rgba(18, 52, 42, .14);
    border: 1px solid var(--ice);
  }

  /* ===== Capçalera ===== */
  .capcalera-logo {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 24px 12px; background: #fff;
    border-top: 6px solid var(--pine);
  }
  .capcalera-logo img { height: 54px; width: auto; display: block; }
  .kicker {
    font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
    color: var(--moss); text-align: right;
  }
  .banda {
    position: relative; padding: 22px 24px 26px; color: #fff; overflow: hidden;
    background: linear-gradient(135deg, var(--pine-dark) 0%, var(--pine) 60%, var(--moss) 100%);
    border-bottom: 4px solid var(--orange);
  }
  .banda h1 {
    position: relative; z-index: 2;
    font-family: 'Baloo 2', 'Public Sans', Arial, sans-serif; font-weight: 800;
    font-size: 32px; line-height: 1.1; margin: 0;
  }
  .banda .neu { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

  /* ===== Cos ===== */
  .cos { padding: 22px 24px 26px; background: var(--snow); }
  .enunciat {
    margin: 0 0 18px; padding: 12px 16px; font-size: 17px; line-height: 1.45;
    background: var(--frost); border-left: 5px solid var(--moss); border-radius: 8px; color: var(--pine-dark);
  }
  ol { list-style: none; margin: 0; padding: 0; counter-reset: n; }
  li {
    display: flex; align-items: center; gap: 12px; padding: 11px 12px 11px 10px; margin-bottom: 9px;
    background: #fff; border: 2px solid var(--ice); border-radius: 10px; counter-increment: n;
    transition: border-color .15s, background .15s;
  }
  li::before {
    content: counter(n); flex: none; width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Baloo 2', Arial, sans-serif; font-weight: 700; font-size: 17px;
    color: #fff; background: var(--pine);
  }
  li .text { flex: 1; font-size: 16px; line-height: 1.35; font-weight: 500; }
  li.correcte { border-color: var(--ok); background: var(--ok-bg); }
  li.correcte::before { background: var(--ok); }
  li.incorrecte { border-color: var(--ko); background: var(--ko-bg); color: #8f211b; }
  li.incorrecte::before { background: var(--ko); }
  .fletxes { display: flex; gap: 5px; flex: none; }
  .fletxes button {
    width: 34px; height: 34px; border: 1.5px solid var(--lichen); background: var(--frost); color: var(--pine);
    border-radius: 8px; cursor: pointer; font-size: 14px; line-height: 1; padding: 0;
  }
  .fletxes button:hover:not(:disabled) { background: var(--pine); color: #fff; border-color: var(--pine); }
  .fletxes button:disabled { opacity: .3; cursor: default; }
  .fletxes button:focus-visible, .accions button:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

  .accions { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }
  .accions button {
    padding: 11px 20px; font-family: 'Public Sans', Arial, sans-serif; font-size: 15px; font-weight: 700;
    border-radius: 10px; cursor: pointer; border: 2px solid var(--pine);
  }
  #btnCorregeix { background: var(--pine); color: #fff; }
  #btnCorregeix:hover { background: var(--pine-dark); border-color: var(--pine-dark); }
  #btnRepeteix { background: #fff; color: var(--pine); }
  #btnRepeteix:hover { background: var(--frost); }

  #resultat { margin-top: 16px; font-size: 17px; font-weight: 700; color: var(--pine-dark); min-height: 26px; }
  #resultat .nota { font-weight: 500; }
  #resultat.perfecte { color: var(--ok); }

  @media (max-width: 520px) {
    .capcalera-logo { padding: 12px 16px 10px; }
    .capcalera-logo img { height: 42px; }
    .banda { padding: 18px 16px 22px; }
    .banda h1 { font-size: 26px; }
    .cos { padding: 18px 14px 22px; }
    .kicker { font-size: 10.5px; }
  }
</style>
</head>

<script>
/* ====== CONFIGURACIÓ: només cal canviar això ====== */
const KICKER = "Història d’Espanya · 2n de batxillerat";
const TITOL = "Ordena cronològicament";
const ENUNCIAT = "Ordeneu aquests fets cronològicament, del més antic al més recent.";
// Escriu els fets JA en l'ordre correcte. El joc els barreja sol.
const FETS = [
  "Sexenni Democràtic (1868-1874)",
  "Govern autoritari del general Serrano",
  "Manifest de Sandhurst (desembre de 1874)",
  "Pronunciament de Martínez Campos a Sagunt",
  "Retorn d’Alfons XII"
];
/* ================================================== */

const llistaEl = document.getElementById("llista");
const resultatEl = document.getElementById("resultat");
document.getElementById("kicker").textContent = KICKER;
document.getElementById("titol").textContent = TITOL;
document.getElementById("enunciat").textContent = ENUNCIAT;

// ordre actual: array d'índexs dins FETS (l'índex és la posició correcta)
let ordre = [];

function netejaResultat() {
  resultatEl.innerHTML = "";
  resultatEl.className = "";
}

function barreja() {
  ordre = FETS.map((_, i) => i);
  do {
    for (let i = ordre.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [ordre[i], ordre[j]] = [ordre[j], ordre[i]];
    }
  } while (ordre.length > 1 && ordre.every((v, i) => v === i));
}

function pinta(corregit) {
  llistaEl.innerHTML = "";
  ordre.forEach((idx, pos) => {
    const li = document.createElement("li");
    if (corregit) li.className = (idx === pos) ? "correcte" : "incorrecte";

    const text = document.createElement("span");
    text.className = "text";
    text.textContent = FETS[idx];
    li.appendChild(text);

    const f = document.createElement("span");
    f.className = "fletxes";
    const amunt = document.createElement("button");
    amunt.textContent = "▲";
    amunt.title = "Puja";
    amunt.setAttribute("aria-label", "Puja: " + FETS[idx]);
    amunt.disabled = pos === 0;
    amunt.onclick = () => mou(pos, -1);
    const avall = document.createElement("button");
    avall.textContent = "▼";
    avall.title = "Baixa";
    avall.setAttribute("aria-label", "Baixa: " + FETS[idx]);
    avall.disabled = pos === ordre.length - 1;
    avall.onclick = () => mou(pos, 1);
    f.appendChild(amunt);
    f.appendChild(avall);
    li.appendChild(f);

    llistaEl.appendChild(li);
  });
}

function mou(pos, dir) {
  const nou = pos + dir;
  if (nou < 0 || nou >= ordre.length) return;
  [ordre[pos], ordre[nou]] = [ordre[nou], ordre[pos]];
  netejaResultat();
  pinta(false);
}

document.getElementById("btnCorregeix").onclick = () => {
  const encerts = ordre.filter((idx, pos) => idx === pos).length;
  pinta(true);
  let html = encerts + " de " + FETS.length + " encerts.";
  if (encerts === FETS.length) {
    html += ' <span class="nota">Molt bé! Ordre perfecte.</span>';
    resultatEl.className = "perfecte";
  } else {
    html += ' <span class="nota">Repasseu el que ha sortit en vermell.</span>';
    resultatEl.className = "";
  }
  resultatEl.innerHTML = html;
};

document.getElementById("btnRepeteix").onclick = () => {
  barreja();
  netejaResultat();
  pinta(false);
};

barreja();
pinta(false);
</script>
</body>
</html>
